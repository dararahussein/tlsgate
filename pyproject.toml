[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tlsgate"
version = "0.1.0"
description = "Async TLS ClientHello inspection reverse proxy with JA4 fingerprinting, distributed Redis Lua rate limiting, and XDP fast-path blocking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.1.0",
    "psycopg[binary]>=3.2.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
linux = [
    "uvloop>=0.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "locust>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tlsgate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
